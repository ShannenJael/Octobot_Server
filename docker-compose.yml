services:
  octobot:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        OCTOBOT_IMAGE: ${OCTOBOT_IMAGE:-drakkarsoftware/octobot:stable}
    image: octobot-local:latest
    container_name: octobot-local
    environment:
      WEB_PORT: "5001"
      PORT: "5001"
      OCTOBOT_STANDALONE: "true"
    command:
      - --standalone
      - --host
      - 0.0.0.0
      - --port
      - "5001"
    ports:
      - "${OCTOBOT_HOST_PORT:-5002}:5001"
    volumes:
      - ./user:/octobot/user
      - ./tentacles:/octobot/tentacles
      - ./logs:/octobot/logs
      - ./backtesting:/octobot/backtesting
    restart: unless-stopped
