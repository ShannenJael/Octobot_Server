services:
  octobot:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        OCTOBOT_IMAGE: ${OCTOBOT_IMAGE:-drakkarsoftware/octobot:stable}
    image: octobot-local:latest
    container_name: octobot-local
    environment:
      WEB_PORT: "5001"
      PORT: "5001"
      OCTOBOT_STANDALONE: "true"
      MARKET_RADAR_CACHE_SECONDS: "120"
      MARKET_RADAR_AI_ENABLED: "${MARKET_RADAR_AI_ENABLED:-false}"
      MARKET_RADAR_AI_MODEL: "${MARKET_RADAR_AI_MODEL:-gpt-5-mini}"
      MARKET_RADAR_PAPER_HANDOFF_ENABLED: "${MARKET_RADAR_PAPER_HANDOFF_ENABLED:-false}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      CRYPTO_COM_API_KEY: "${CRYPTO_COM_API_KEY:-}"
      CRYPTO_COM_API_SECRET: "${CRYPTO_COM_API_SECRET:-}"
    command:
      - --standalone
      - --host
      - 0.0.0.0
      - --port
      - "5001"
    ports:
      - "${OCTOBOT_HOST_PORT:-5002}:5001"
    volumes:
      - ./user:/octobot/user
      - ./market_radar:/octobot/market_radar
      - ./tentacles:/octobot/tentacles
      - ./logs:/octobot/logs
      - ./backtesting:/octobot/backtesting
    restart: unless-stopped

  tunnel:
    # Legacy local-preview path only. AWS deployments use the load balancer
    # defined in aws/terraform and do not need Cloudflare or Netlify.
    profiles:
      - legacy-tunnel
    image: cloudflare/cloudflared:latest
    container_name: octobot-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://octobot:5001
    depends_on:
      - octobot
