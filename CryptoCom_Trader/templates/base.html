<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Crypto.com AI Pro Trader & Strategy Hub{% endblock %}</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 4.6 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Standalone Trader CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/crypto_com_trader.css') }}?v=standalone_2026">

    <!-- TradingView Widget Script -->
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>

    <style>
        :root {
            --standalone-bg: #07090e;
            --standalone-surface: #0e121a;
            --standalone-border: rgba(255, 255, 255, 0.08);
            --gold: #d4af37;
            --gold-light: #f5d77f;
        }
        body {
            background-color: var(--standalone-bg) !important;
            color: #f0f6fc;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .standalone-navbar {
            background: rgba(12, 16, 25, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--standalone-border);
            padding: 0.75rem 1.5rem;
        }
        .brand-logo {
            font-weight: 800;
            letter-spacing: -0.5px;
            font-size: 1.15rem;
            color: #fff;
            display: flex;
            align-items: center;
            text-decoration: none !important;
        }
        .brand-logo:hover {
            color: var(--gold-light);
        }
        .brand-logo i {
            color: var(--gold);
        }
        .brand-badge {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.2), rgba(212, 175, 55, 0.05));
            color: var(--gold-light);
            border: 1px solid rgba(212, 175, 55, 0.35);
            font-size: 0.7rem;
            font-weight: 700;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .standalone-footer {
            margin-top: auto;
            background: #090c12;
            border-top: 1px solid var(--standalone-border);
            padding: 0.75rem 1.5rem;
            font-size: 0.8rem;
            color: #6b7280;
        }
    </style>
    {% block additional_style %}{% endblock %}
</head>
<body>

    <!-- Main Navigation Bar -->
    <nav class="navbar navbar-expand-lg standalone-navbar sticky-top">
        <div class="container-fluid">
            <a class="brand-logo" href="/">
                <i class="fas fa-bolt mr-2"></i>
                <span>Crypto.com <span class="text-white font-weight-light">Pro Trader</span></span>
                <span class="brand-badge ml-2">AI Hub</span>
            </a>

            <div class="ml-auto d-flex align-items-center gap-3">
                <span class="badge badge-dark border border-secondary px-2 py-1 text-muted small mr-3">
                    <span class="text-success mr-1">●</span> API Online
                </span>
                <a href="https://crypto.com/exchange" target="_blank" rel="noopener" class="btn btn-sm btn-outline-secondary text-muted mr-2">
                    <i class="fas fa-external-link-alt mr-1"></i> Exchange
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content Body -->
    <div class="container-fluid flex-grow-1 px-3 px-md-4">
        {% block body %}{% endblock %}
    </div>

    <!-- Standalone Footer -->
    <footer class="standalone-footer text-center">
        <div class="container-fluid d-flex justify-content-between align-items-center flex-wrap">
            <div>
                <span>Crypto.com AI Pro Trader & Strategy Hub • Standalone Edition</span>
            </div>
            <div class="text-muted">
                <span>Fast-Cycle Seconds Scalper • Multi-AI Telemetry (Antigravity & Codex)</span>
            </div>
        </div>
    </footer>

    <!-- jQuery & Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

    {% block scripts %}{% endblock %}
</body>
</html>
